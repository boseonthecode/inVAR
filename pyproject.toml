[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epl"
version = "0.0.0"
description = "EPL match prediction from pre-match info only"
requires-python = ">=3.11"
dependencies = [
    "pandas==3.0.5",
    "scikit-learn==1.9.0",
    "lightgbm==4.7.0",
    "pyarrow==26.0.0",
    "matplotlib==3.11.1",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
